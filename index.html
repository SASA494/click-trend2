<!doctype html>
<html lang="ar" dir="rtl">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#f7f7f4" /><meta name="description" content="كليك + ترند — شريكك الإبداعي لنمو العلامات التجارية." /><title>كليك + ترند | تسويق يصنع الفرق</title>
    <script>
      try {
        const theme = localStorage.getItem('click-trend-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        const language = localStorage.getItem('click-trend-language') || 'ar'
        document.documentElement.dataset.theme = theme
        document.documentElement.lang = language
        document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr'
      } catch {}
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
